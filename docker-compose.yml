services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: issue_tracker
      POSTGRES_PASSWORD: issue_tracker
      POSTGRES_DB: issue_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U issue_tracker"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
